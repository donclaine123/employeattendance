<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workline - Employee Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Background Depth Layer -->
    <div class="ambient-light">
      <div class="light-orb orb-1"></div>
      <div class="light-orb orb-2"></div>
      <div class="light-orb orb-3"></div>
    </div>

    <!-- Main Layout Container -->
    <div class="layout-container">
        
        <!-- Left Side: St. Clare Image -->
        <div class="visual-side">
            <img src="images/stclareimage.jpeg" alt="St. Clare College" class="feature-image" />
        </div>

        <!-- Right Side: The Glass Card (Existing) -->
        <div class="auth-side">
            <div class="glass-card">
                <!-- Internal Card Header -->
                <header class="card-header">
                  <div class="logo-container">
                    <div class="logo-backdrop">
                      <img src="images/logo1.png" alt="Workline" class="logo-img" />
                    </div>
                  </div>
                  <h1 class="app-title">Workline</h1>
                  <p class="app-subtitle">Employee Attendance Portal</p>
                </header>
        
                <!-- Login Form -->
                <form id="loginForm" class="auth-form">
                  <div id="messageContainer" class="toast-container"></div>
        
                  <div class="input-group">
                    <label for="email" class="field-label">Email Address</label>
                    <div class="glass-input-wrapper">
                      <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                      </span>
                      <input
                        type="email"
                        id="email"
                        name="email"
                        class="glass-input"
                        placeholder="name@workline.com"
                        autocomplete="email"
                        required
                      />
                    </div>
                  </div>
        
                  <div class="input-group">
                    <div class="label-row">
                      <label for="password" class="field-label">Password</label>
                    </div>
                    <div class="glass-input-wrapper">
                      <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                      </span>
                      <input
                        type="password"
                        id="password"
                        name="password"
                        class="glass-input"
                        placeholder="••••••••"
                        required
                      />
                      <button
                        type="button"
                        id="passwordToggle"
                        class="toggle-visibility"
                        aria-label="Toggle password visibility"
                      >
                        <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-icon eye-closed" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                      </button>
                    </div>
                  </div>
        
                  <div class="form-actions">
                    <a href="#" class="link-text">Forgot password?</a>
                  </div>
        
                  <button type="submit" class="glass-btn-primary">
                    <span>Sign In</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                  </button>
                </form>
        
                <footer class="card-footer">
                  <a href="#" class="link-subtle contact-support">Help & Support</a>
                </footer>
            </div>
        </div>

    </div>

    <!-- Support Modal -->
    <div id="supportModal" class="modal-backdrop">
        <div class="modal-glass-card">
            <div class="modal-header">
                <h3>Contact Support</h3>
                <button class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Having trouble? We're here to help.</p>
                
                <div class="contact-option">
                    <div class="contact-icon">📧</div>
                    <div>
                        <span class="contact-label">Email HR</span>
                        <a href="mailto:hr@stclare.edu.ph" class="contact-value">hr@stclare.edu.ph</a>
                    </div>
                </div>

                <div class="contact-option">
                    <div class="contact-icon">📞</div>
                    <div>
                        <span class="contact-label">IT Helpdesk</span>
                        <span class="contact-value">+63 (02) 8123-4567</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="glass-btn-secondary modal-close-action">Close</button>
            </div>
        </div>
    </div>

    <!-- Essential Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    
    <script>
        // Password Toggle
        const toggleBtn = document.getElementById('passwordToggle');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const open = this.querySelector('.eye-open');
                const closed = this.querySelector('.eye-closed');
                if(open.style.display === 'none') {
                    open.style.display = 'block';
                    closed.style.display = 'none';
                } else {
                    open.style.display = 'none';
                    closed.style.display = 'block';
                }
            });
        }

        // Support Modal Logic
        const modal = document.getElementById('supportModal');
        const openBtns = document.querySelectorAll('.contact-support');
        const closeBtns = document.querySelectorAll('.modal-close-btn, .modal-close-action');

        openBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                modal.classList.add('active');
            });
        });

        closeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modal.classList.remove('active');
            });
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
  </body>
</html>
