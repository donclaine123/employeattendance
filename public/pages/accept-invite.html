<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Setup - Workline</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Inline overrides for specific registration layout needs -->
    <style>
        .glass-card {
            max-width: 500px; /* Slightly wider for registration form */
        }
        
        .invite-info {
            background: color-mix(in srgb, var(--bg-tertiary), transparent 50%);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--accent-primary);
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
        }

        .invite-info p {
            margin: 0.5rem 0;
        }

        .invite-info strong {
            color: var(--text-primary);
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-primary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            background: color-mix(in srgb, var(--red-badge-bg), transparent 20%);
            color: var(--red-badge-text);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            border: 1px solid var(--red-primary);
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Ambient Background -->
    <div class="ambient-light">
        <div class="light-orb orb-1"></div>
        <div class="light-orb orb-2"></div>
        <div class="light-orb orb-3"></div>
    </div>

    <main class="glass-wrapper">
        <div class="glass-card">
            
            <!-- Header -->
            <header class="card-header">
                <div class="logo-container">
                    <div class="logo-backdrop">
                        <img src="../images/logo1.png" alt="Workline" class="logo-img" />
                    </div>
                </div>
                <h1 class="app-title">Account Setup</h1>
                <p class="app-subtitle">Complete your registration</p>
            </header>

            <!-- Loading State -->
            <div id="loadingState" class="loading-spinner">
                <div class="spinner"></div>
                <p>Verifying invitation...</p>
            </div>

            <!-- Invalid State -->
            <div id="invalidState" style="display: none; text-align: center; width: 100%;">
                <h3 style="color: var(--red-primary); margin-bottom: 0.5rem;">Invalid Invitation</h3>
                <p id="invalidReason" style="color: var(--text-muted); margin-bottom: 1.5rem;">Link expired or invalid.</p>
                <a href="../index.html" class="glass-btn-primary" style="text-decoration: none;">Back to Login</a>
            </div>

            <!-- Success State -->
            <div id="successState" style="display: none; text-align: center; width: 100%;">
                <div style="width: 60px; height: 60px; background: var(--green-badge-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; border: 1px solid var(--green-primary);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h3 style="color: var(--text-primary); margin-bottom: 0.5rem;">All Set!</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Your account has been created successfully.</p>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Redirecting to login...</p>
            </div>

            <!-- Main Form -->
            <div id="inviteForm" style="display: none; width: 100%;">
                
                <div id="inviteInfo" class="invite-info">
                    <!-- Dynamic Info -->
                </div>

                <div id="errorMessage" class="error-message"></div>

                <form id="accountForm" class="auth-form">
                    
                    <!-- Name Fields Row -->
                    <div style="display: flex; gap: 1rem;">
                        <div class="input-group" style="flex: 1;">
                            <label for="firstName" class="field-label">First Name</label>
                            <div class="glass-input-wrapper">
                                <input type="text" id="firstName" name="firstName" class="glass-input" style="padding-left: 1rem;" required maxlength="50">
                            </div>
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label for="lastName" class="field-label">Last Name</label>
                            <div class="glass-input-wrapper">
                                <input type="text" id="lastName" name="lastName" class="glass-input" style="padding-left: 1rem;" required maxlength="50">
                            </div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="password" class="field-label">Password</label>
                        <div class="glass-input-wrapper">
                            <input type="password" id="password" name="password" class="glass-input" style="padding-left: 1rem;" required minlength="8">
                        </div>
                        <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Min. 8 characters</span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirmPassword" class="field-label">Confirm Password</label>
                        <div class="glass-input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="glass-input" style="padding-left: 1rem;" required>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="glass-btn-primary">
                        Create Account
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <footer class="card-footer">
                <a href="#" class="link-subtle">Help</a>
            </footer>

        </div>
    </main>

    <!-- Essential Scripts -->
    <script src="../js/shared/config.js"></script>
    <script src="../js/shared/api.js"></script>
    
    <!-- Inline Logic Adapted from Original -->
    <script>
        class InviteAcceptance {
            constructor() {
                this.token = new URLSearchParams(window.location.search).get('token');
                this.invitationData = null;
                
                this.elements = {
                    loadingState: document.getElementById('loadingState'),
                    invalidState: document.getElementById('invalidState'),
                    invalidReason: document.getElementById('invalidReason'),
                    inviteForm: document.getElementById('inviteForm'),
                    inviteInfo: document.getElementById('inviteInfo'),
                    errorMessage: document.getElementById('errorMessage'),
                    accountForm: document.getElementById('accountForm'),
                    submitBtn: document.getElementById('submitBtn'),
                    successState: document.getElementById('successState')
                };

                this.init();
            }
            
            /**
             * Transform database role names to user-friendly display names
             */
            transformRoleName(roleName) {
                const roleMap = {
                    'hr': 'Monitoring',
                    'HR': 'Monitoring',
                    'Hr': 'Monitoring',
                    'department_head': 'Department Head',
                    'employee': 'Employee',
                    'superadmin': 'System Administrator'
                };
                return roleMap[roleName] || roleName;
            }

            async init() {
                if (!this.token) {
                    this.showInvalidState('No invitation token provided.');
                    return;
                }
                await this.verifyInvitation();
                this.setupFormHandlers();
            }

            async verifyInvitation() {
                try {
                    // Using the referenced API
                    const response = await window.AppApi.apiFetch(`/invitations/verify/${this.token}`);
                    
                    if (!response || !response.valid) {
                        this.showInvalidState(response.error || 'Invalid invitation');
                        return;
                    }

                    this.invitationData = response.invitation;
                    this.showInviteForm();
                    this.populateInviteInfo();

                } catch (error) {
                    console.error('Error verifying invitation:', error);
                    this.showInvalidState('Failed to verify invitation. Please try again.');
                }
            }

            showInvalidState(reason) {
                this.elements.loadingState.style.display = 'none';
                this.elements.invalidReason.textContent = reason;
                this.elements.invalidState.style.display = 'block';
            }

            showInviteForm() {
                this.elements.loadingState.style.display = 'none';
                this.elements.inviteForm.style.display = 'block';
            }

            populateInviteInfo() {
                if (!this.invitationData) return;
                const { email, role_name, dept_name, expires_at, invited_by } = this.invitationData;
                const expiryDate = new Date(expires_at).toLocaleDateString();
                const displayRoleName = this.transformRoleName(role_name);

                this.elements.inviteInfo.innerHTML = `
                    <p><strong>Email:</strong> ${email}</p>
                    <p><strong>Role:</strong> ${displayRoleName}</p>
                    ${dept_name ? `<p><strong>Department:</strong> ${dept_name}</p>` : ''}
                    <p><strong>Invited by:</strong> ${invited_by || 'System'}</p>
                    <p><strong>Expires:</strong> ${expiryDate}</p>
                `;
            }

            setupFormHandlers() {
                this.elements.accountForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleFormSubmit();
                });

                document.getElementById('confirmPassword').addEventListener('input', (e) => {
                    const password = document.getElementById('password').value;
                    const confirmPassword = e.target.value;
                    if (confirmPassword && password !== confirmPassword) {
                        e.target.setCustomValidity('Passwords do not match');
                    } else {
                        e.target.setCustomValidity('');
                    }
                });
            }

            async handleFormSubmit() {
                const formData = new FormData(this.elements.accountForm);
                const password = formData.get('password');
                const confirmPassword = formData.get('confirmPassword');

                if (password !== confirmPassword) {
                    this.showError('Passwords do not match');
                    return;
                }

                if (password.length < 8) {
                    this.showError('Password must be at least 8 characters long');
                    return;
                }

                this.elements.submitBtn.disabled = true;
                this.elements.submitBtn.textContent = 'Creating...';
                this.hideError();

                try {
                    const response = await window.AppApi.apiFetch('/auth/accept-invite', {
                        method: 'POST',
                        body: JSON.stringify({
                            token: this.token,
                            first_name: formData.get('firstName').trim(),
                            last_name: formData.get('lastName').trim(),
                            password: password
                        })
                    });

                    if (!response) {
                        this.showError('Failed to create account');
                        return;
                    }

                    this.showSuccess(response.user);

                } catch (error) {
                    console.error('Error creating account:', error);
                    this.showError(error.message || 'Network error.');
                } finally {
                    this.elements.submitBtn.disabled = false;
                    this.elements.submitBtn.textContent = 'Create Account';
                }
            }

            showError(message) {
                this.elements.errorMessage.textContent = message;
                this.elements.errorMessage.style.display = 'block';
            }

            hideError() {
                this.elements.errorMessage.style.display = 'none';
            }

            showSuccess(user) {
                this.elements.inviteForm.style.display = 'none';
                this.elements.successState.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '../index.html'; // Redirect to new glass login
                }, 3000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new InviteAcceptance();
        });
    </script>
</body>
</html>
