<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Workline</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .glass-card {
            max-width: 400px;
        }
        
        .validation-message {
            color: var(--red-primary);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.2rem;
            display: none;
        }
    </style>
</head>

<body class="login-light">
    <!-- Ambient glowing orbs (Light Mode variations controlled in style.css) -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <main class="glass-wrapper">
        <div class="glass-card">

            <!-- Header -->
            <header class="card-header">
                <div class="logo-container">
                    <div class="logo-backdrop">
                        <img src="../images/logo1.png" alt="Workline" class="logo-img" />
                    </div>
                </div>
                <h1 class="app-title" style="margin-top: 1rem;">Reset Password</h1>
                <p class="auth-copy">Create a new secure password.</p>
            </header>

            <form id="resetForm" class="auth-form" novalidate>
                
                <div class="form-group">
                    <label for="newPassword" class="field-label">New Password</label>
                    <div class="glass-input-wrapper">
                        <span class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="newPassword" class="glass-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="field-label">Confirm Password</label>
                    <div class="glass-input-wrapper">
                        <span class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="confirmPassword" class="glass-input" placeholder="••••••••" required>
                    </div>
                    <!-- Inline validation error message -->
                    <div id="passwordError" class="validation-message" aria-live="polite"></div>
                </div>

                <button type="submit" class="glass-btn-primary" id="submitBtn">
                    <span class="btn-spinner" style="display: none;"></span>
                    <span class="btn-text">Update Password</span>
                </button>
            </form>

            <div id="statusMessage" style="text-align: center; display: none; padding: 1rem 0;">
                <h3 id="statusTitle" style="color: #0f172a; margin-bottom: 0.5rem; font-weight: 600;">Success</h3>
                <p id="statusDesc" style="color: #475569; margin-bottom: 1.5rem;">Your password has been successfully reset.</p>
                <a href="../index.html" class="glass-btn-primary" style="text-decoration: none; display: inline-block; width: 100%; box-sizing: border-box; text-align: center;">Back to Login</a>
            </div>

        </div>
    </main>

    <!-- Toast container for notifications -->
    <div id="messageContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/modules/auth/reset-password.js" type="module"></script>
</body>
</html>
