services:
  - type: web
    name: employeattendance-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: employeattendance-db
          property: connectionString
      - key: PGCONNECT_TIMEOUT
        value: 30
      - key: PGCOMMAND_TIMEOUT
        value: 60000
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
      - key: UV_USE_IO_URING
        value: 0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUD_SUPABASE_URL
        sync: false
      - key: CLOUD_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://employeeattendance.me