  #   image: postgres:15-alpine
  #   container_name: employeeattendance-postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./server/postgres/schema_clean.sql:/docker-entrypoint-initdb.d/01-schema.sql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - supabase_network_employeattendance

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: employeeattendance-app
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      JWT_SECRET: my-super-secret-jwt-key-for-employee-attendance-system-2025
      SECRET_KEYS: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:14322/postgres
      FRONTEND_URL: http://localhost:3000
      BASE_URL: http://localhost:5000
      DOMAIN_NAME: local.employeeattendance.me
      SSL_ENABLED: "true"
      SUPABASE_URL: ${LOCAL_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CLOUD_SUPABASE_URL: ${CLOUD_SUPABASE_URL}
      CLOUD_SUPABASE_ANON_KEY: ${CLOUD_SUPABASE_ANON_KEY}
      CLOUD_SUPABASE_SERVICE_ROLE_KEY: ${CLOUD_SUPABASE_SERVICE_ROLE_KEY}
      LOCAL_SUPABASE_URL: ${LOCAL_SUPABASE_URL}
      LOCAL_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      EMAIL_PROVIDER: brevo
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Database Config for SyncService
      DB_HOST: host.docker.internal
      DB_PORT: 14322
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - supabase_network_employeattendance
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4

  nginx:
    image: nginx:alpine
    container_name: employeeattendance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Phase 7: Let's Encrypt certificates volume (read-only)
      # Mount Windows Certbot directory to container /etc/letsencrypt
      - C:\Certbot\live:/etc/letsencrypt/live:ro
    depends_on:
      - app
    networks:
      - supabase_network_employeattendance
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome:latest
    container_name: employeeattendance-adguard
    ports:
      - "8080:8080"      # AdGuard Home Admin Interface
      - "53:53/tcp"      # DNS TCP
      - "53:53/udp"      # DNS UDP
    volumes:
      - ./AdGuardHome/work:/opt/adguardhome/work
      - ./AdGuardHome/conf:/opt/adguardhome/conf
    environment:
      - TZ=Asia/Manila
    depends_on:
      - app
    networks:
      - supabase_network_employeattendance
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  supabase_network_employeattendance:
    external: true
