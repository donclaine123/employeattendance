user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Upstream server pointing to Docker container Node.js app
    # Use Docker service name 'app' which resolves to the container on the network
    upstream node_app {
        server app:5000;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name workline.local localhost 127.0.0.1 192.168.1.199 192.168.137.1 local.employeeattendance.me www.local.employeeattendance.me *.local.employeeattendance.me local.attendance.me www.local.attendance.me *.local.attendance.me local.employettendance.me www.local.employettendance.me *.local.employettendance.me;

        # Phase 6: HTTP→HTTPS Redirect (CRITICAL for security)
        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
        
        # Allow HTTP for .well-known ACME challenge (certificate renewal)
        location /.well-known/acme-challenge/ {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://node_app;
        }
    }

    # HTTPS server - reverse proxy with SSL (Let's Encrypt certificates)
    server {
        listen 443 ssl http2;
        server_name workline.local localhost 127.0.0.1 192.168.1.199 192.168.137.1 local.employeeattendance.me www.local.employeeattendance.me *.local.employeeattendance.me local.attendance.me www.local.attendance.me *.local.attendance.me local.employettendance.me www.local.employettendance.me *.local.employettendance.me;

        # Phase 6: SSL Configuration - Let's Encrypt Certificates
        # Fallback to self-signed if Let's Encrypt certs not found
        # Primary: Let's Encrypt (DNS-01 challenge) - mounted from nginx/certs
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        # Fallback: Self-signed certificates (for initial setup)
        ssl_trusted_certificate certs/server-cert.pem;
        
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        
        # Phase 6: HSTS Header (CRITICAL for security)
        # Enforces HTTPS for 1 year (31536000 seconds)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Main proxy configuration
        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            
            # Preserve original headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_set_header Connection "upgrade";
            proxy_set_header Upgrade $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering off;
            
            # Security headers (Phase 6)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Socket.IO specific - real-time communications (Phase 6)
        location /socket.io {
            proxy_pass http://node_app/socket.io;
            proxy_http_version 1.1;
            proxy_buffering off;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $scheme://$server_name;
        }

        # Static files caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://node_app;
            proxy_cache_valid 200 1d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://node_app;
        }
        
        # ACME challenge endpoint (for certificate renewal)
        location /.well-known/acme-challenge/ {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}